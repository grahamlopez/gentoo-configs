# Common policy is evaluated first. The selected target may then override only
# the settings that genuinely differ for that machine.
source /etc/portage/make.conf.d/00-common

GENTOO_TARGET_HOST=$(</etc/gentoo-config/target-host)
case ${GENTOO_TARGET_HOST} in
  generic|qemu|thinktop)
    source "/etc/portage/make.conf.d/90-${GENTOO_TARGET_HOST}"
    ;;
  *)
    echo "Unsupported Gentoo target host: ${GENTOO_TARGET_HOST}" >&2
    return 1
    ;;
esac
unset GENTOO_TARGET_HOST
